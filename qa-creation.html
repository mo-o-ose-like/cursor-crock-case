<header>Cursor</header><main class="form-page"><form id="create-form"><a class="back form-back" href="#deals"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5m6 6-6-6 6-6"/></svg>К сделкам</a><h1>Новая сделка</h1><div class="form-section first"><label class="field"><span>Название сделки <b>*</b></span><input name="title" type="text" value="Новая платформа" placeholder="Например, внедрение ERP" required maxlength="160"></label><label class="field"><span>Компания-клиент <b>*</b></span><input name="company" type="text" value="АО Пример" placeholder="Название организации" required maxlength="160"></label></div><section class="form-section"><h2>Источники данных</h2><p class="sub">Можно выбрать несколько источников или начать с пустой карты.</p><div class="sources"><div class="source-tile chosen"><button type="button" class="source-toggle" data-source="crm" aria-pressed="true"><span class="source-icon"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span><span><strong>Импорт из CRM</strong><small>Сделка, компания и связанные контакты</small></span><i class="choice"><svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></i></button></div><div class="source-tile chosen"><button type="button" class="source-toggle" data-source="web" aria-pressed="true"><span class="source-icon"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></span><span><strong>Поиск в интернете</strong><small>Открытые сведения о компании</small></span><i class="choice"><svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></i></button></div><div class="source-tile "><button type="button" class="source-toggle" data-source="file" aria-pressed="false"><span class="source-icon"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-4.5 4.5L12 3l4.5 4.5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span><span><strong>Загрузить файл</strong><small>CSV, XLSX, PDF, DOCX</small></span><i class="choice"></i></button></div><div class="source-tile "><button type="button" class="source-toggle" data-source="link" aria-pressed="false"><span class="source-icon"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 8 3-3a4.3 4.3 0 0 1 6.1 6.1L16 14m-2 2-3 3a4.3 4.3 0 0 1-6.1-6.1L8 10m1 5 6-6"/></svg></span><span><strong>Добавить ссылку</strong><small>Сайт компании, документ или база знаний</small></span><i class="choice"></i></button></div></div><p class="hint"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9v.1"/></svg>В демоверсии источники дают примеры данных. Содержимое файлов и ссылок не отправляется на сервер.</p></section><p id="form-error" class="error" role="alert"></p><footer class="form-footer"><button type="submit" class="btn primary">Создать карту</button></footer></form></main>
